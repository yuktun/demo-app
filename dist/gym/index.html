<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#090f1c" />
    <meta
      name="description"
      content="本機私人健身紀錄：循序漸進，練好每一下。"
    />
    <title>巨人計劃 — Gym Tracker</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到內容</a>
    <header>
      <a class="brand" href="./"
        ><span class="mark">巨</span
        ><span>巨人計劃<small>GYM TRACKER</small></span></a
      ><button id="safety-open" class="quiet">安全須知</button>
    </header>
    <div id="notice" role="status" aria-live="polite"></div>
    <main id="main" tabindex="-1"></main>
    <nav aria-label="主要分頁">
      <button data-tab="today">◈<span>今日訓練</span></button
      ><button data-tab="plan">▦<span>週計劃</span></button
      ><button data-tab="library">▤<span>動作圖鑑</span></button
      ><button data-tab="progress">↗<span>我的進度</span></button>
    </nav>
    <dialog id="modal">
      <div id="modal-content"></div>
      <button id="modal-close" class="wide">關閉</button>
    </dialog>
    <noscript>請啟用 JavaScript 使用本機訓練紀錄。</noscript>
  </body>
</html>
